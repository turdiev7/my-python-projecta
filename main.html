<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart For Her</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }
        #text {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: #ffb6c1;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
            z-index: 10;
            pointer-events: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="text">this is for you</div>

    <!-- Подключаем библиотеку Three.js через CDN -->
    <script src="https://cloudflare.com"></script>
    <script>
        // Инициализация трехмерной сцены
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.z = 25;

        // Конфигурация частиц
        const count = 6000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        // Палитра неоновых и розовых цветов для сердца
        const colorChoices = [
            new THREE.Color('#ff1493'), // Розовый (Deep Pink)
            new THREE.Color('#ff69b4'), // Горячий розовый (Hot Pink)
            new THREE.Color('#ffb6c1'), // Светло-розовый
            new THREE.Color('#ff0000')  // Красный
        ];

        // Генерация точек по математической формуле 3D-сердца
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            
            // Параметрическое уравнение сердца
            const x = 16 * Math.pow(Math.sin(angle), 3);
            const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
            // Добавляем случайную толщину (Z-координату) для создания 3D объема
            const z = (Math.random() - 0.5) * 12 * (1 - Math.abs(angle / Math.PI)); 

            const scale = 0.55 + Math.random() * 0.15;
            positions[i * 3] = x * scale;
            positions[i * 3 + 1] = y * scale;
            positions[i * 3 + 2] = z * scale;

            // Присваиваем случайный цвет каждой частице
            const color = colorChoices[Math.floor(Math.random() * colorChoices.length)];
            colors[i * 3] = color.r;
            colors[i * 3 + 1] = color.g;
            colors[i * 3 + 2] = color.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Создаем программную круглую текстуру, чтобы частицы красиво светились и плавно рассеивались
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 16, 16);
        const texture = new THREE.CanvasTexture(canvas);

        // Настройка материала для эффекта свечения (Additive Blending)
        const material = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            map: texture,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.9
        });

        const heartParticles = new THREE.Points(geometry, material);
        scene.add(heartParticles);

        const clock = new THREE.Clock();

        // Цикл анимации (Render Loop)
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Эффект биения сердца (пульсация размера с помощью функции синуса)
            const pulse = 1 + Math.sin(time * 3.8) * 0.07;
            heartParticles.scale.set(pulse, pulse, pulse);

            // Плавное вращение сердца в 3D пространстве
            heartParticles.rotation.y = time * 0.25;
            heartParticles.rotation.x = Math.sin(time * 0.15) * 0.12;

            renderer.render(scene, camera);
        }

        animate();

        // Поддержка изменения размеров окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
